# Values helm lint renders with, exercising both mounted file kinds.
configFiles:
  listen.xml: |
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>
    </clickhouse>
usersFiles:
  profile.xml: |
    <clickhouse>
        <profiles>
            <default>
                <max_threads>1</max_threads>
            </default>
        </profiles>
    </clickhouse>
extraEnv:
  - name: CLICKHOUSE_SKIP_USER_SETUP
    value: "1"
backup:
  enabled: true
  url: https://example.r2.cloudflarestorage.com/bucket
  databases:
    - example
  existingSecret: r2-backup
  recoverFrom: https://example.r2.cloudflarestorage.com/bucket/example/20260101T000000Z
