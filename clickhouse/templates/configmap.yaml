{{- if or .Values.configFiles .Values.usersFiles (include "clickhouse.s3" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  {{- if include "clickhouse.s3" . }}
  config.d-s3-credentials.xml: |
    <clickhouse>
        <s3>
            <use_environment_credentials>true</use_environment_credentials>
        </s3>
    </clickhouse>
  {{- end }}
  {{- range $name, $content := .Values.configFiles }}
  config.d-{{ $name }}: {{ $content | quote }}
  {{- end }}
  {{- range $name, $content := .Values.usersFiles }}
  users.d-{{ $name }}: {{ $content | quote }}
  {{- end }}
{{- end }}
