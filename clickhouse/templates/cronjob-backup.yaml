{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clickhouse.fullname" . }}-backup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "clickhouse.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: {{ include "clickhouse.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                {{- include "clickhouse.backupEnv" . | nindent 16 }}
              # The server uploads, the client only issues the statement and waits for it.
              command:
                - sh
                - -euc
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  {{- range required "backup.databases is required" .Values.backup.databases }}
                  clickhouse-client --host "$CLICKHOUSE_HOST" --query "BACKUP DATABASE {{ . }} TO S3('$BACKUP_URL/{{ . }}/$stamp', '$ACCESS_KEY_ID', '$SECRET_ACCESS_KEY')"
                  {{- end }}
{{- end }}
