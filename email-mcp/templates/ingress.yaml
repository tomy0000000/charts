{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "email-mcp.fullname" . }}
  labels:
    {{- include "email-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ include "email-mcp.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          # "/" rather than "/mcp": the secret-path form lives at /<token>/mcp.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "email-mcp.fullname" . }}
                port:
                  name: http
{{- end }}
