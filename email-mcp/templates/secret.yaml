{{- if not .Values.auth.existingSecret }}
{{- $name := include "email-mcp.fullname" . }}
{{- $token := .Values.auth.token }}
{{- if not $token }}
{{- /* Keep the token stable across upgrades by reading the one already in the cluster. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 32 | sha256sum }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "email-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
